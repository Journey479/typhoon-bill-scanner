# =============================================================================
# env.example.yaml — เทมเพลต (commit ขึ้น git ได้ ไม่มีค่าจริง)
# วิธีใช้: copy เป็น env.yaml แล้วเติมค่าจริง (env.yaml ถูก git-ignore ไว้)
#   Copy-Item env.example.yaml env.yaml
# =============================================================================

# --- เป้าหมาย deploy (ใช้โดย deploy.ps1) ---
PROJECT_ID: "your-gcp-project-id"
REGION: "asia-southeast3"
SERVICE: "docscan"
SA_EMAIL: "your-sa@your-gcp-project-id.iam.gserviceaccount.com"

# --- ความลับ ---
TYPHOON_API_KEYS: "sk-xxxxx"              # หลายคีย์คั่นด้วย , ได้เลย
GEMINI_API_KEY: ""                       # คีย์ Gemini จาก AI Studio (Vision ใช้ SA ของ Cloud Run เอง) — ว่าง = ใช้ Typhoon ล้วน
TELEGRAM_TOKEN: "1234567:AAxxxxx"
TELEGRAM_CHAT_ID: "123456789"            # seed เริ่มต้น (แชทอื่นเก็บอัตโนมัติใน _telegram_chats.txt)
TRIGGER_TOKEN: "ใส่ค่าสุ่มยาว ๆ ให้ตรงกับ code.gs (python -c \"import secrets;print(secrets.token_urlsafe(32))\")"

# --- Google Sheet / โฟลเดอร์ Drive ---
SPREADSHEET_ID: "xxxxx"
SHEET_TAB_NAME: "Raw_Data"
ERROR_SHEET_TAB: "Error"   # แท็บบันทึกเอกสารที่สแกนไม่ผ่าน (สร้างให้อัตโนมัติ ไว้กรอกเองต่อได้)
FOLDER_INBOX: "xxxxx"
FOLDER_PROCESSING: "xxxxx"
FOLDER_SUCCESS: "xxxxx"
FOLDER_ERROR: "xxxxx"

# --- Typhoon API / พฤติกรรม OCR ---
TYPHOON_BASE_URL: "https://api.opentyphoon.ai/v1"
TYPHOON_OCR_MODEL: "typhoon-ocr"
TYPHOON_LLM_MODEL: "typhoon-v2.5-30b-a3b-instruct"
TYPHOON_OCR_TASK_TYPE: "default"
TYPHOON_OCR_TIMEOUT: "120"
TYPHOON_OCR_MAX_TOKENS: "4096"

# --- Google Vision + Gemini (เครื่องยนต์หลัก ใช้โควตาฟรีก่อน แล้ว fallback ไป Typhoon) ---
GEMINI_FLASH_MODEL: "gemini-2.5-flash"
GEMINI_FLASH_LITE_MODEL: "gemini-2.5-flash-lite"
GEMINI_DAILY_LIMIT_PER_MODEL: "20"       # โควตาฟรี/โมเดล/วัน (2 โมเดล = 40 ไฟล์/วัน)
GOOGLE_QUOTA_RESET_HOUR: "7"             # รีเซ็ตตัวนับตอน 07:00
GOOGLE_QUOTA_TZ_OFFSET: "7"              # เขตเวลา (ไทย = UTC+7) -> 07:00 ไทย = เที่ยงคืน UTC
VISION_MONTHLY_LIMIT: "1000"             # เพดาน Vision OCR/เดือน (ฟรี 1000 หน้า) ครบแล้วสลับไป Typhoon

# --- อื่น ๆ ---
DEFAULT_AUTORUN: "on"
